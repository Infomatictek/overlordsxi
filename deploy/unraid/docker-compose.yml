###############################################################################
# SoulspireXI — Unraid Production Docker Compose Stack
#
# Networking Architecture:
#   - MariaDB runs on an isolated bridge network and binds ONLY to 127.0.0.1:3306
#     on the Unraid host (never exposed to LAN, WireGuard, or WAN).
#   - Game-facing services (xi-world, xi-connect, xi-search, xi-profile, xi-map)
#     use host networking to avoid FFXI UDP/TCP NAT/protocol edge cases and
#     bind seamlessly to Unraid's WireGuard interface (e.g. 10.77.0.2).
#   - xi-world ZeroMQ IPC binds strictly to 127.0.0.1:54003.
#
# Usage:
#   cp .env.example .env && chmod 600 .env   # fill in strong passwords
#   ./scripts/overlords-ctl.sh init
#   ./scripts/overlords-ctl.sh build v2026.11.19
#   ./scripts/overlords-ctl.sh deploy v2026.11.19
###############################################################################

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "25m"
    max-file: "5"

x-game-common: &game-common
  image: "${OVERLORDS_IMAGE:-overlordsxi/server}:${OVERLORDS_TAG:-latest}"
  network_mode: host
  restart: unless-stopped
  stop_grace_period: 30s
  logging: *default-logging
  environment:
    TZ: "${TZ:-America/Chicago}"
    XI_NETWORK_SQL_HOST: "127.0.0.1"
    XI_NETWORK_SQL_PORT: "3306"
    XI_NETWORK_SQL_DATABASE: "${MARIADB_DATABASE:-xidb}"
    XI_NETWORK_SQL_LOGIN: "${MARIADB_USER:-overlords}"
    XI_NETWORK_SQL_PASSWORD: "${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set in .env}"
    XI_NETWORK_ZMQ_IP: "127.0.0.1"
    XI_NETWORK_ZMQ_PORT: "54003"
    XI_NETWORK_TLS_KEY: "/server/certs/login.key"
    XI_NETWORK_TLS_CERT: "/server/certs/login.cert"
    XI_NETWORK_ENABLE_HTTP: "${XI_NETWORK_ENABLE_HTTP:-false}"
  volumes:
    - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/config/settings:/server/settings"
    - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/config/certs:/server/certs"
    - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/logs:/server/log"
    - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/meshes/navmeshes:/server/navmeshes:ro"
    - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/meshes/ximeshes:/server/ximeshes:ro"

services:
  mariadb:
    image: "mariadb:${MARIADB_VERSION:-10.11}"
    container_name: overlordsxi-mariadb
    restart: unless-stopped
    stop_grace_period: 45s
    logging: *default-logging
    networks:
      - overlords_db
    # Bound ONLY to Unraid loopback — unreachable from LAN, WireGuard, or internet
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      TZ: "${TZ:-America/Chicago}"
      MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD must be set in .env}"
      MARIADB_DATABASE: "${MARIADB_DATABASE:-xidb}"
      MARIADB_USER: "${MARIADB_USER:-overlords}"
      MARIADB_PASSWORD: "${MARIADB_PASSWORD:?MARIADB_PASSWORD must be set in .env}"
    volumes:
      - "${APPDATA_DIR:-/mnt/user/appdata/overlordsxi}/mariadb:/var/lib/mysql"
      - "./config/mariadb/overlordsxi.cnf:/etc/mysql/conf.d/overlordsxi.cnf:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 20s
      interval: 10s
      timeout: 5s
      retries: 6

  xi-world:
    <<: *game-common
    container_name: overlordsxi-world
    command: ["/server/xi_world", "--log", "/server/log/world-server.log"]
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 54003"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 4

  xi-connect:
    <<: *game-common
    container_name: overlordsxi-connect
    command: ["/server/xi_connect", "--log", "/server/log/login-server.log"]
    depends_on:
      mariadb:
        condition: service_healthy
      xi-world:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 54231 && nc -z 127.0.0.1 54230 && nc -z 127.0.0.1 54001"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 4

  xi-search:
    <<: *game-common
    container_name: overlordsxi-search
    command: ["/server/xi_search", "--log", "/server/log/search-server.log"]
    depends_on:
      mariadb:
        condition: service_healthy
      xi-world:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 54002"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 4

  xi-profile:
    <<: *game-common
    container_name: overlordsxi-profile
    command: ["/server/xi_profile", "--log", "/server/log/profile-server.log"]
    depends_on:
      mariadb:
        condition: service_healthy
      xi-world:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 51220 && nc -z 127.0.0.1 51240"]
      start_period: 15s
      interval: 15s
      timeout: 5s
      retries: 4

  xi-map:
    <<: *game-common
    container_name: overlordsxi-map
    command: ["/server/xi_map", "--log", "/server/log/map-server.log"]
    depends_on:
      mariadb:
        condition: service_healthy
      xi-world:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ss -lun | grep -q ':54230 '"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 4

  # Optional one-shot DB schema update container (invoked manually via overlords-ctl.sh)
  db-migrate:
    <<: *game-common
    container_name: overlordsxi-db-migrate
    profiles: ["tools"]
    restart: "no"
    command: ["python", "/server/tools/dbtool.py", "update"]
    depends_on:
      mariadb:
        condition: service_healthy

networks:
  overlords_db:
    driver: bridge
