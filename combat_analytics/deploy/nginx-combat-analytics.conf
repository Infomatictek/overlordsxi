# Add inside your existing SWAG/Nginx `server { ... }` block for the SoulspireXI Wiki,
# OR drop into SWAG's `/config/nginx/proxy-confs/combat-analytics.subfolder.conf`
# (which `default.conf` includes automatically before `location /`).
#
# Proxies `/api/combat/` to the lightweight Combat Analytics Python service while
# keeping the rest of the wiki static/GitHub-synced.

location ^~ /api/combat/ {
    # Recommended for Docker SWAG: dynamic upstream resolution via SWAG's resolver.conf
    # so Nginx never fails to start/reload if the analytics container is temporarily stopped.
    include /config/nginx/resolver.conf;
    set $upstream_app overlordsxi-combat-analytics;
    set $upstream_port 8765;
    set $upstream_proto http;
    proxy_pass $upstream_proto://$upstream_app:$upstream_port;

    # Alternative for systemd/host install on the same host (no Docker DNS):
    # proxy_pass http://127.0.0.1:8765/api/combat/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Never cache private authenticated API responses or share tokens in Nginx
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 512k;
    proxy_read_timeout 30s;
}
