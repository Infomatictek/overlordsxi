# Add inside your existing SWAG/Nginx `server { ... }` block for the OverlordsXI Wiki.
# Proxies `/api/combat/` to the lightweight Combat Analytics Python service while
# keeping the rest of the wiki static/GitHub-synced.

location /api/combat/ {
    # Use `http://127.0.0.1:8765` for systemd/host install, or
    # `http://overlordsxi-combat-analytics:8765` on a shared Docker SWAG network.
    proxy_pass http://127.0.0.1:8765/api/combat/;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Never cache private authenticated API responses or share tokens in Nginx
    proxy_buffering off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 512k;
    proxy_read_timeout 30s;
}
