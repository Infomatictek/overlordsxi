name: Update SoulspireXI Wiki Data

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
      - fix/**
    paths:
      - 'modules/custom/lua/**'
      - 'modules/custom/commands/**'
      - 'modules/custom/sql/**'
      - 'modules/init.append.txt'
      - 'patches/**'
      - 'docs/guides/**'
      - 'scripts/generate-site-data.py'
      - 'scripts/soul_actions_wiki.py'
      - 'scripts/export_lua_wiki_data.lua'
      - 'tools/audit_soul_coverage.py'
      - 'tools/soul_coverage_baseline.json'
      - 'tests/test_ci_tooling.py'
      - 'tests/test_soul_actions_wiki.py'
      - '.github/workflows/update-wiki.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'modules/custom/lua/**'
      - 'modules/custom/commands/**'
      - 'modules/custom/sql/**'
      - 'modules/init.append.txt'
      - 'patches/**'
      - 'docs/guides/**'
      - 'scripts/generate-site-data.py'
      - 'scripts/soul_actions_wiki.py'
      - 'scripts/export_lua_wiki_data.lua'
      - 'tools/audit_soul_coverage.py'
      - 'tools/soul_coverage_baseline.json'
      - 'tests/test_ci_tooling.py'
      - 'tests/test_soul_actions_wiki.py'
      - '.github/workflows/update-wiki.yml'
  workflow_dispatch:
    inputs:
      launcher_ref:
        description: 'Launcher repository ref or commit SHA for Soul action definitions'
        required: false
        default: 'main'
        type: string
  repository_dispatch:
    types:
      - launcher-soul-actions-updated

concurrency:
  group: update-wiki-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  validate-wiki-data:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout server repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 100

      - name: Checkout launcher repository for Soul action definitions
        uses: actions/checkout@v7
        with:
          repository: Infomatictek/soulspirexi-launcher
          ref: ${{ github.event.inputs.launcher_ref || github.event.client_payload.launcher_sha || 'main' }}
          path: .launcher-repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Lua 5.3 for exact Lua module evaluation
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Generate and validate site/data.json and site/data.js
        run: |
          python scripts/generate-site-data.py --require-lua --launcher-dir .launcher-repo --strict-actions
          node --check site/data.js
          node --check site/app.js

      - name: Run CI tooling and Soul action wiki unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Upload validated wiki data for main publication
        if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.event_name == 'repository_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: validated-wiki-data
          path: |
            site/data.json
            site/data.js
          retention-days: 1

  publish-wiki-data:
    needs: validate-wiki-data
    if: (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 100

      - name: Checkout launcher repository for fresh regeneration fallback
        uses: actions/checkout@v7
        with:
          repository: Infomatictek/soulspirexi-launcher
          ref: ${{ github.event.inputs.launcher_ref || github.event.client_payload.launcher_sha || 'main' }}
          path: .launcher-repo
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Download validated wiki data
        uses: actions/download-artifact@v8
        with:
          name: validated-wiki-data
          path: site

      - name: Safely commit and push updated wiki data to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          lua_installed=false
          ensure_lua() {
            if [ "$lua_installed" = false ]; then
              sudo apt-get update
              sudo apt-get install -y lua5.3
              lua_installed=true
            fi
          }

          regenerate_fresh() {
            ensure_lua
            python scripts/generate-site-data.py --require-lua --launcher-dir .launcher-repo --strict-actions
            node --check site/data.js
          }

          max_attempts=3
          for attempt in $(seq 1 "$max_attempts"); do
            git fetch origin main
            local_head="$(git rev-parse HEAD)"
            remote_head="$(git rev-parse origin/main)"

            if [ "$local_head" != "$remote_head" ]; then
              echo "origin/main advanced ($local_head -> $remote_head); resetting and regenerating fresh wiki data (attempt $attempt/$max_attempts)..."
              git reset --hard origin/main
              regenerate_fresh
            fi

            if git diff --quiet -- site/data.json site/data.js; then
              echo "No wiki data changes to commit."
              exit 0
            fi

            git add site/data.json site/data.js
            git commit -m "chore(wiki): auto-update site/data.json from latest server modules [skip ci]"

            if git push origin HEAD:refs/heads/main; then
              echo "Published updated wiki data to main."
              exit 0
            fi

            echo "Push rejected on attempt $attempt/$max_attempts due to concurrent update; retrying cleanly without force-push..."
            git fetch origin main
            git reset --hard origin/main
            regenerate_fresh
          done

          echo "Failed to push wiki data after $max_attempts attempts due to concurrent updates." >&2
          exit 1
