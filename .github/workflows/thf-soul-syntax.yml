name: THF Soul Lua syntax

on:
  push:
    branches:
      - feature/thf-souls-first-pass
    paths:
      - 'modules/custom/lua/thf_specs.lua'
      - '.github/workflows/thf-soul-syntax.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua compiler
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Parse THF implementation
        run: luac5.4 -p modules/custom/lua/thf_specs.lua
