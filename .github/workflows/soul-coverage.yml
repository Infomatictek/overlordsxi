name: Soul coverage audit

on:
  push:
    paths:
      - 'tools/audit_soul_coverage.py'
      - 'tests/test_soul_coverage.py'
      - '.github/workflows/soul-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test registration scanner
        run: python3 -m unittest discover -s tests -p 'test_soul_coverage.py' -v
      - name: Check static Soul registration evidence
        shell: bash
        run: |
          python3 tools/audit_soul_coverage.py . --csv soul-coverage.csv > soul-coverage.tsv
          echo "=== Catalog-only candidates (not proof of missing) ==="
          awk -F '\t' 'NR==1 || $3=="catalog-only" {print $1 "\t" $2 "\t" $3}' soul-coverage.tsv
          echo "=== Referenced-only candidates (inspect these) ==="
          awk -F '\t' 'NR>1 && $3=="referenced-only" {print $1 "\t" $2 "\t" $3}' soul-coverage.tsv
          echo "=== Evidence counts ==="
          cut -f3 soul-coverage.tsv | sort | uniq -c
      - name: Post unresolved Soul evidence to audit issue
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          {
            echo "### Automated Soul coverage evidence — ${GITHUB_SHA:0:8}"
            echo
            echo "Static registrations do not prove a Soul is playable. Missing static evidence is a review candidate."
            echo
            echo '~~~'
            awk -F '\t' 'NR>1 && $3!="registration-evidence" {printf "%s/%s: %s\\n", $1,$2,$3}' soul-coverage.tsv
            echo '~~~'
            echo
            echo "Full CSV available as the workflow artifact."
          } > soul-coverage-comment.md
          gh issue comment 20 --repo "$GITHUB_REPOSITORY" --body-file soul-coverage-comment.md
      - name: Upload evidence matrix
        uses: actions/upload-artifact@v4
        with:
          name: soul-coverage
          path: |
            soul-coverage.csv
            soul-coverage.tsv
