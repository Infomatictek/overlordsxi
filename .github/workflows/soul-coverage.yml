name: Soul coverage audit

on:
  push:
    paths:
      - 'tools/audit_soul_coverage.py'
      - 'tests/test_soul_coverage.py'
      - '.github/workflows/soul-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test registration scanner
        run: python3 -m unittest discover -s tests -p 'test_soul_coverage.py' -v
      - name: Check static Soul registration evidence
        shell: bash
        run: |
          python3 tools/audit_soul_coverage.py . --csv soul-coverage.csv > soul-coverage.tsv
          echo "=== Catalog-only candidates (not proof of missing) ==="
          awk -F '\t' 'NR==1 || $3=="catalog-only" {print $1 "\t" $2 "\t" $3}' soul-coverage.tsv
          echo "=== Referenced-only candidates (inspect these) ==="
          awk -F '\t' 'NR>1 && $3=="referenced-only" {print $1 "\t" $2 "\t" $3}' soul-coverage.tsv
          echo "=== Evidence counts ==="
          cut -f3 soul-coverage.tsv | sort | uniq -c
      - name: Upload evidence matrix
        uses: actions/upload-artifact@v4
        with:
          name: soul-coverage
          path: |
            soul-coverage.csv
            soul-coverage.tsv
