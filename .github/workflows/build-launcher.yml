name: Build Client Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "launcher/**"
      - "dat-overlay/**"
      - "addons/ashita4/**"
      - "scripts/update-launcher-manifest.py"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify launcher manifest hashes match repo files
        shell: pwsh
        run: |
          python scripts/update-launcher-manifest.py
          git diff --exit-code launcher/manifest.json

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore launcher/OverlordsLauncher.sln

      - name: Build solution
        run: dotnet build launcher/OverlordsLauncher.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test launcher/OverlordsLauncher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file Windows client launcher
        run: >
          dotnet publish launcher/OverlordsLauncher/OverlordsLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish/OverlordsLauncher

      - name: Package distributable archive
        shell: pwsh
        run: |
          $sampleConfig = @'
          {
            "ServerName": "OverlordsXI",
            "DefaultHost": "127.0.0.1",
            "UseHairpin": false,
            "LobbyPort": 54231,
            "SearchPort": 54002
          }
          '@
          Set-Content -Path "publish/OverlordsLauncher/overlords-server.example.json" -Value $sampleConfig -Encoding UTF8
          Compress-Archive -Path "publish/OverlordsLauncher/OverlordsLauncher.exe", "publish/OverlordsLauncher/overlords-server.example.json" -DestinationPath "OverlordsLauncher-win-x64.zip" -Force

      - name: Upload launcher build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OverlordsLauncher-win-x64
          path: |
            publish/OverlordsLauncher/OverlordsLauncher.exe
            OverlordsLauncher-win-x64.zip

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/OverlordsLauncher/OverlordsLauncher.exe
            OverlordsLauncher-win-x64.zip
